apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbyte
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://airbytehq.github.io/helm-charts
    chart: airbyte
    targetRevision: 1.7.8
    helm:
      skipCrds: true
      parameters:
        - name: server.livenessProbe.initialDelaySeconds
          value: "120"
        - name: server.livenessProbe.periodSeconds
          value: "15"
        - name: server.livenessProbe.failureThreshold
          value: "5"
        - name: server.readinessProbe.initialDelaySeconds
          value: "60"
        - name: server.readinessProbe.periodSeconds
          value: "10"
        - name: server.readinessProbe.failureThreshold
          value: "5"
      values: |
        global:
          database:
            host: airbyte-postgres.ingestion.svc.cluster.local
            port: 5432
            database: airbyte
            user: airbyte
            password: airbyte123
          # type: minio (igual ao local). NAO usar type: s3: o chart nao
          # injeta endpoint nenhum nesse modo e o SDK vai pra AWS S3
          # publica — onde existe um bucket "airbyte-storage" de outra
          # conta em eu-west-1 (erro 500: "region 'us-east-1' is wrong;
          # expecting 'eu-west-1'"). Com type: minio o chart seta
          # MINIO_ENDPOINT e S3_PATH_STYLE_ACCESS=true sozinho.
          # JOB_MAIN_CONTAINER_*_REQUEST sobrescreve todas as variantes de
          # recurso do airbyte-server (sem isso, sync de source de banco
          # pede orchestrator 2 CPU/2Gi + source 1 + destination 1 = 4 CPU,
          # e o pod de replicacao nunca agenda em t3.large). Precisa ser
          # string aqui: via helm "parameters" o "0" vira int 0 e o chart
          # renderiza vazio.
          jobs:
            resources:
              requests:
                cpu: "0"
                memory: "256Mi"

          storage:
            type: minio
            storageSecretName: airbyte-storage-secret
            bucket:
              log: airbyte-storage
              state: airbyte-storage
              workloadOutput: airbyte-storage
            minio:
              endpoint: http://minio-eks-hl.data-platform.svc.cluster.local:9000
              accessKeyIdSecretKey: AWS_ACCESS_KEY_ID
              secretAccessKeySecretKey: AWS_SECRET_ACCESS_KEY

        webapp:
          enabled: true
          replicaCount: 1
          service:
            type: LoadBalancer
            port: 8001
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Recursos medidos em carga (2026-09-23): memoria = pico medido,
        # cpu = ~metade do p95 (comprimivel).
        server:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 20m
              memory: 640Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        worker:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 20m
              memory: 448Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        temporal:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi

        workload-launcher:
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 768Mi

        workload-api-server:
          resources:
            requests:
              cpu: 10m
              memory: 384Mi
            limits:
              memory: 640Mi

        cron:
          resources:
            requests:
              cpu: 10m
              memory: 416Mi
            limits:
              memory: 768Mi

        connector-builder-server:
          resources:
            requests:
              cpu: 10m
              memory: 320Mi
            limits:
              memory: 512Mi

        postgresql:
          enabled: false

        # Com type: minio o chart sempre cria um StatefulSet airbyte-minio
        # (hook pre-install, sem toggle — "enabled" e' ignorado), que
        # BLOQUEIA o resto do sync ate' ficar Healthy. quay.io/minio/minio
        # (qualquer tag, inclusive esta) parou de aceitar pull anonimo em
        # 2026-09-24 (MinIO Inc. trancou o namespace legado, Docker Hub
        # tambem). Novo caminho publico oficial: quay.io/minio/aistor/minio
        # — mesma tag ja validada no local e no minio-objectstore deste
        # ambiente. Nao afeta o Airbyte de verdade: o storage real usado e'
        # o MinIO da plataforma (global.storage.minio.endpoint acima),
        # esse StatefulSet fica ocioso e nunca e' lido por nada — so'
        # precisa ficar Ready.
        minio:
          image:
            repository: quay.io/minio/aistor/minio
            tag: RELEASE.2026-09-19T17-05-25Z
          # Ocioso (~100Mi); o default reservava 1Gi/250m. O template exige
          # os 4 valores.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

        airbyteBootloader:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingestion
  # Nao usar ignoreDifferences + RespectIgnoreDifferences=true aqui: o
  # ArgoCD deixa de podar/atualizar recursos que batem na regra
  # (ConfigMap airbyte-airbyte-env ficava com valores antigos).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - PruneLast=true
