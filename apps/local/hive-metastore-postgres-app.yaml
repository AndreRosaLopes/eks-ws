apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hive-metastore-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 16.4.15
    helm:
      values: |
        fullnameOverride: hive-metastore-postgres
        auth:
          database: metastore
          username: hive
          password: hive123
        primary:
          persistence:
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # JDBC Catalog do Iceberg (Trino). Roda como superusuario so' na
          # primeira inicializacao (PVC vazio) — o usuario hive nao tem
          # CREATEDB no chart Bitnami. Equivalente local do
          # charts/postgres-eks/iceberg-catalog-init-job.yaml.
          initdb:
            scripts:
              iceberg-catalog.sql: |
                CREATE DATABASE iceberg_catalog OWNER hive;
                \c iceberg_catalog
                SET ROLE hive;
                CREATE TABLE IF NOT EXISTS iceberg_tables (
                    catalog_name VARCHAR(255) NOT NULL,
                    table_namespace VARCHAR(255) NOT NULL,
                    table_name VARCHAR(255) NOT NULL,
                    metadata_location VARCHAR(1000),
                    previous_metadata_location VARCHAR(1000),
                    PRIMARY KEY (catalog_name, table_namespace, table_name)
                );
                CREATE TABLE IF NOT EXISTS iceberg_namespace_properties (
                    catalog_name VARCHAR(255) NOT NULL,
                    namespace VARCHAR(255) NOT NULL,
                    property_key VARCHAR(255) NOT NULL,
                    property_value VARCHAR(1000),
                    PRIMARY KEY (catalog_name, namespace, property_key)
                );
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
