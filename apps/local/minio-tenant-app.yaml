apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-tenant
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://operator.min.io
    chart: tenant
    targetRevision: 6.0.4
    helm:
      values: |
        tenant:
          name: minio-local
          # Default do chart (quay.io/minio/minio) parou de aceitar pull
          # anonimo em 2026-09-24 (MinIO Inc. trancou o namespace legado).
          # Novo caminho publico oficial: quay.io/minio/aistor/minio.
          image:
            repository: quay.io/minio/aistor/minio
            tag: RELEASE.2026-09-19T17-05-25Z
          pools:
            - servers: 1
              name: pool-0
              volumesPerServer: 1
              size: 20Gi
              storageClassName: standard
          mountPath: /data
          certificate:
            requestAutoCert: false
          prometheusOperator: false
          env:
            - name: MINIO_BROWSER
              value: "on"
            # Licenca AIStor Free (single-node, gratuita, obtida em
            # subnet.min.io — sem ela o servidor sobe mas recusa operacoes
            # S3 com "AccessDenied: No license is installed"). Valor
            # direto (nao caminho de arquivo — o operator injeta tudo em
            # tenant.env como export VAR=valor dentro de config.env,
            # igual MINIO_ROOT_PASSWORD). O Secret minio-local-license
            # precisa ser criado manualmente no cluster (nunca commitado
            # — mesmo motivo do ecr-pull-secret):
            #   kubectl create secret generic minio-local-license \
            #     -n data-platform --from-literal=minio.license='<jwt>'
            - name: MINIO_LICENSE
              valueFrom:
                secretKeyRef:
                  name: minio-local-license
                  key: minio.license
          configSecret:
            name: minio-local-env-configuration
          configuration:
            name: minio-local-env-configuration
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
