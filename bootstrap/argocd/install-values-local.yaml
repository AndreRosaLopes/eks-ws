# Um unico bloco "server:" (havia dois; o YAML fica so' com o ultimo e o
# NodePort era descartado). NodePort 30080 -> localhost:8080 via
# infra/clusters/local/kind-config.yaml.
server:
  service:
    type: NodePort
    nodePortHttp: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

configs:
  params:
    server.insecure: true

controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  # 256Mi causava OOMKill ao gerar manifests de varios charts remotos
  # grandes em paralelo (kube-prometheus-stack, openmetadata, airflow,
  # airbyte, trino) — mesmo problema ja documentado e corrigido no EKS
  # (install-values-eks.yaml), replicado aqui.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

notifications:
  enabled: false

dex:
  enabled: false
