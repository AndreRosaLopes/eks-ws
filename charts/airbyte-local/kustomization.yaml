      - AWS_ACCESS_KEY_ID=6AqQif6bwByfEXP08vv2
      - AWS_SECRET_ACCESS_KEY=6vN8soeJmYJF3HW2Y93yq81wTf9OGffouG79g1vX

generatorOptions:
