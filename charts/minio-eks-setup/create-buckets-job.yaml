# Cria os buckets do lakehouse no MinIO do EKS (idempotente). Buckets e
# manifest vem do ConfigMap minio-setup-config (kustomization.yaml).
#
# Usa aws s3api (nao mc): quay.io/minio/mc passou a exigir autenticacao
# mesmo pra pull anonimo (confirmado via fluxo de auth do registry, nao e'
# problema de rede) e o Docker Hub nao tem mais tag publica utilizavel.
# amazon/aws-cli funciona contra qualquer endpoint S3-compativel via
# --endpoint-url, incluindo MinIO. Mesmo fix ja aplicado no local.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: data-platform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z minio-eks-hl.data-platform.svc.cluster.local 9000; do
                echo "aguardando MinIO..."; sleep 5
              done
      containers:
        - name: create-buckets
          image: amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              value: WoHk3PgusweklIZv96Uy
            - name: AWS_SECRET_ACCESS_KEY
              value: noNt9HRW93NyQzTqC9OUwfME5LGXPWr1lsXOb2jW
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ENDPOINT=http://minio-eks-hl.data-platform.svc.cluster.local:9000
              for b in $(cat /config/buckets); do
                aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$b" 2>/dev/null \
                  && echo "bucket $b ja existe" \
                  || aws --endpoint-url "$ENDPOINT" s3api create-bucket --bucket "$b"
              done
              # Manifest do conector S3 do OpenMetadata: sem ele so os
              # buckets sao catalogados, sem os arquivos/schemas.
              aws --endpoint-url "$ENDPOINT" s3 cp /config/openmetadata-bronze.json s3://bronze/openmetadata.json
              aws --endpoint-url "$ENDPOINT" s3 ls
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: minio-setup-config
