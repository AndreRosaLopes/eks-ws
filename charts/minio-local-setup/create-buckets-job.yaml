# Cria os buckets do lakehouse no MinIO local (idempotente). Buckets vem do
# ConfigMap minio-setup-config (kustomization.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: data-platform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set minio http://minio-local-hl.data-platform.svc.cluster.local:9000 minio minio123
              until mc ready minio; do
                echo "aguardando MinIO..."; sleep 10
              done
              for b in $(cat /config/buckets); do
                mc mb "minio/$b" --ignore-existing
              done
              mc ls minio
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: minio-setup-config
