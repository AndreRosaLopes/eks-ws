apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airflow
  namespace: observability
  labels:
    app: airflow
spec:
  # Métricas vêm do statsd-exporter do chart do Airflow (o Airflow emite
  # StatsD via UDP; o exporter converte e serve em :9102/metrics). O
  # /health do api-server devolve JSON, nao formato Prometheus.
  namespaceSelector:
    matchNames:
      - ingestion
  selector:
    matchLabels:
      component: statsd
      release: airflow
  endpoints:
    - port: statsd-scrape
      path: /metrics
      interval: 30s
