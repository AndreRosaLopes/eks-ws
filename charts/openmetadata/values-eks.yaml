# Overrides do OpenMetadata para EKS (aplicado sobre values-local.yaml)

# Medido em carga (2026-09-23): ~1,27Gi (JVM). Sem request o scheduler do
# k8s o empilhava em node ja cheio e o node travava por memoria.
# 2026-10-02: subiu p/ 1800Mi/3Gi. Com 2Gi o pod ficou em ~1971Mi (limite) e
# o reindex do OpenSearch (openmetadata-ops.sh reindex) morreu com
# OutOfMemoryError: o heap padrao do chart e' -Xmx1G e a segunda JVM do CLI
# roda dentro do mesmo container. Heap sobe p/ 1536M via extraEnvs abaixo.
resources:
  requests:
    cpu: 20m
    memory: 1800Mi
  limits:
    memory: 3Gi

extraEnvs:
  - name: OPENMETADATA_HEAP_OPTS
    value: "-Xmx1536M -Xms1536M"

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
